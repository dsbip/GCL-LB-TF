type: "internal"
project_id: "my-gcp-project"
region: "us-central1"
name: "my-internal-lb"

network:
  name: "my-vpc"
  subnet: "my-subnet"

proxy_subnet:
  create: false

ssl:
  existing_certificate: "projects/my-gcp-project/regions/us-central1/sslCertificates/my-cert"

# ------------------------------------------------------------------------------
# SSL policy (optional) — controls TLS versions and cipher suites.
#   Option A — create a new policy:
#     profile: "MODERN" | "RESTRICTED" | "COMPATIBLE" | "CUSTOM"
#     min_tls_version: "TLS_1_0" | "TLS_1_1" | "TLS_1_2" (default: TLS_1_2)
#     custom_features: [...]  # only when profile is CUSTOM
#
#   Option B — reference an existing SSL policy:
#     existing: "projects/my-gcp-project/global/sslPolicies/my-policy"
# ------------------------------------------------------------------------------
# ssl_policy:
#   profile: "MODERN"
#   min_tls_version: "TLS_1_2"

# IP address: leave empty to create a reserved static IP, or provide a
# specific IP / self-link to use a pre-existing address.
ip_address: ""

backends:
  default:
    cloud_run_service: "frontend-service"
  api:
    cloud_run_service: "api-service"
    paths:
      - "/api"
      - "/api/*"
