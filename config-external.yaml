# ==============================================================================
# Global External Application Load Balancer Configuration
# ==============================================================================

type: "external"
project_id: "my-gcp-project"
region: "us-central1"
name: "my-external-lb"

# ------------------------------------------------------------------------------
# SSL configuration
#   Option A — Google-managed certificate (recommended for external):
#     managed_domains: ["app.example.com"]
#
#   Option B — self-managed certificate (provide PEM file paths):
#     certificate_file: "certs/cert.pem"
#     private_key_file: "certs/key.pem"
#
#   Option C — reference an existing global SSL certificate:
#     existing_certificate: "projects/my-gcp-project/global/sslCertificates/my-cert"
# ------------------------------------------------------------------------------
ssl:
  managed_domains:
    - "app.example.com"

# ------------------------------------------------------------------------------
# SSL policy (optional) — controls TLS versions and cipher suites.
#   Option A — create a new policy:
#     profile: "MODERN" | "RESTRICTED" | "COMPATIBLE" | "CUSTOM"
#     min_tls_version: "TLS_1_0" | "TLS_1_1" | "TLS_1_2" (default: TLS_1_2)
#     custom_features: [...]  # only when profile is CUSTOM
#
#   Option B — reference an existing SSL policy:
#     existing: "projects/my-gcp-project/global/sslPolicies/my-policy"
# ------------------------------------------------------------------------------
# ssl_policy:
#   profile: "MODERN"
#   min_tls_version: "TLS_1_2"

# ------------------------------------------------------------------------------
# IP address for the global forwarding rule.
# Leave empty ("") or omit to have the module create a reserved static IP.
# Provide a self-link to use a pre-existing reserved address.
# ------------------------------------------------------------------------------
ip_address: ""

# ------------------------------------------------------------------------------
# Backends — Cloud Run services exposed through the load balancer.
# NEGs are regional, but the backend services / URL map are global.
#
# Routing options per backend:
#   paths: ["/api", "/api/*"]           — route by URL path (wildcard host)
#   hosts: ["api.example.com"]          — route by hostname
#   hosts + paths                       — route by hostname AND path
#   (neither)                           — must be named "default" (catch-all)
# ------------------------------------------------------------------------------
backends:
  default:
    cloud_run_service: "frontend-service"

  api:
    cloud_run_service: "api-service"
    paths:
      - "/api"
      - "/api/*"
